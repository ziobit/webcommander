name: Temporary browser validation
on:
  push:
    branches:
      - fix/bounded-large-updates-v1.11
      - feat/packed-assets-v1.12
permissions:
  contents: read
concurrency:
  group: temporary-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, tokenizer, zlib, fileinfo
          coverage: none
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/wc-browser" --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/wc-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify release and run browser regressions
        run: |
          php -v
          sha256sum webcommander.php
          NODE_PATH="$RUNNER_TEMP/wc-browser/node_modules" node tests/keyboard_navigation.js
